name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 纯 SQLite 单引擎（任务单 S1.4b）：不再需要 postgres service container。
    # 数据库是一个文件——测试用默认的 data/mediary.db（gitignored），
    # 生产构建用一次性临时文件，两者都零外部依赖。

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:workflow
      - run: npm run lint
      # 架构门禁（S4.1）：L0 物理布局 / L1 依赖图与循环（存量基线接管）/ L2+L3 在 lint 内
      - run: npm run gate:layout
      - run: npm run gate:deps
      - run: npm run typecheck
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npx tsc -p apps/desktop/tsconfig.json --noEmit
      - run: npx tsc -p workers/tmdb-proxy/tsconfig.json --noEmit
      - run: npx tsc -p workers/scout-connect/tsconfig.json --noEmit
      # Production build with a throwaway SQLite file — mirrors `docker compose build`
      # (no .env at image-build time). cacheComponents prerenders pages at build; any
      # server component that reads the DB outside a connection()/cookies()/searchParams
      # guard writes into this file instead of crashing. With SQLite there is no external
      # DB to be "missing", so this step now proves the build completes cleanly with an
      # isolated (never committed, never shipped) database.
      - run: npm run build:web
        env:
          MEDIA_TRACK_SQLITE_PATH: ${{ runner.temp }}/mediary-build.db
      # One run: the suite is SQLite-only now (the *.pg.test.ts integration files and
      # repository-contract-postgres were removed together with the Postgres dependency).
      - run: npx vitest run
